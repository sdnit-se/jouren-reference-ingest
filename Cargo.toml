[package]
name = "telemetry-ingest"
description = "Sensor telemetry ingest service: readings in, a hot cache of the latest readings, range queries from Postgres"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/sdnit-se/jouren"

[features]
default = []
# Match sensor ids case-insensitively on the query path, for fleets whose
# firmware reports mixed-case ids. Shipped in v1.1.0.
mixed-case-ids = []

# Versions follow the root workspace; this crate stands alone so it can be
# pushed to its own Gitea repository and built there.
#
# TLS policy: rustls on aws-lc-rs only (docs/decisions/0010).
[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["json", "macros", "query", "matched-path"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-aws-lc-rs", "macros", "migrate", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# Blocking reqwest: the SDK's batch processors and the periodic metric reader
# run on their own threads, where the async client has no runtime to drive it.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Development images keep release behaviour with cheaper code generation.
[profile.fast]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
incremental = true

[profile.fast.package."*"]
opt-level = 2
debug = false

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
